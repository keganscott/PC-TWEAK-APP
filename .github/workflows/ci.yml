name: ci

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The real gate: the app only ever runs on Windows.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The pinned, Intel-signed PresentMon that release builds embed. The script
      # refuses anything whose hash, size or signature differs from PINNED.json.
      - name: Fetch and verify PresentMon
        shell: pwsh
        run: ./scripts/fetch-presentmon.ps1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace
        env:
          # Real fsyncs on NTFS make each case slow; the Linux job runs the full 300.
          PROPTEST_CASES: "60"

      # The tests above regenerate src/generated (ts-rs bindings and the JSON
      # fixtures). Anything they changed or added means the committed copy is stale.
      - name: Generated TypeScript is up to date
        shell: pwsh
        run: |
          $changes = git status --porcelain -- src/generated
          if ($changes) {
            Write-Host $changes
            git diff -- src/generated
            throw "src/generated is stale: run 'cargo test -p peaktweaks-engine' and commit the result"
          }

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

      # No user-facing text may promise a result (scripts/claim-words.json, shared
      # with the Rust copy lints). Runs on whatever frontend is in src/.
      - name: UI copy makes no efficacy claims
        run: |
          npm run test:scripts
          npm run lint:copy

      - name: vite build
        run: npm run build

      - name: tauri build (no bundle)
        run: npx tauri build --no-bundle

      - name: Check the manifest was embedded once and asks for admin
        shell: pwsh
        run: |
          $exe = "target\release\peaktweaks.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $admin = ([regex]::Matches($text, 'requireAdministrator')).Count
          $cc6 = ([regex]::Matches($text, 'Microsoft\.Windows\.Common-Controls')).Count
          Write-Host "requireAdministrator x$admin, Common-Controls x$cc6"
          if ($admin -lt 1) { throw "manifest does not request requireAdministrator" }
          if ($cc6 -lt 1) { throw "manifest lost the Common Controls v6 dependency" }

      # Starts the real exe. On a GitHub runner the token is already elevated and
      # UAC is off, so this does NOT prove the UAC prompt; it proves the process
      # starts, the engine initialises (elevation check, user resolution, the
      # protected ProgramData directory), and nothing crashes for 20 seconds.
      - name: Smoke test - launch, engine starts, storage is locked down
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramData 'PeakTweaks'
          if (Test-Path $dir) { throw "$dir already exists on a fresh runner" }
          $startupLog = Join-Path $env:LOCALAPPDATA 'PeakTweaks\startup-error.log'
          $p = Start-Process -FilePath 'target\release\peaktweaks.exe' -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # Wait for evidence, not a fixed time: run 37077991777 needed more than
          # 20 s to reach engine start (first launch of a new exe on a fresh
          # runner). The engine creating its storage, or recording why it could
          # not, is the evidence; how long it took is printed.
          while (-not (Test-Path $dir) -and -not (Test-Path $startupLog) -and -not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 120) {
            Start-Sleep -Milliseconds 250
          }
          Write-Host "engine start evidence after $([int]$sw.Elapsed.TotalMilliseconds) ms"
          # The app stays open when its engine fails (it shows the reason), so
          # "still running" alone does not prove the engine started.
          if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host; throw "the engine failed to start" }
          if (-not (Test-Path $dir)) { throw "engine did not create $dir within 120 s" }
          $rest = 20 - $sw.Elapsed.TotalSeconds
          if ($rest -gt 0) { Start-Sleep -Seconds ([math]::Ceiling($rest)) }
          if ($p.HasExited) { throw "peaktweaks.exe exited early with code $($p.ExitCode)" }
          Write-Host "still running after $([int]$sw.Elapsed.TotalSeconds) s (pid $($p.Id))"
          $acl = (icacls $dir) -join "`n"
          Write-Host $acl
          Stop-Process -Id $p.Id -Force
          if ($acl -match 'Users|Everyone|Authenticated') { throw "storage directory grants access to a non-admin group" }
          if ($acl -notmatch 'SYSTEM') { throw "expected SYSTEM in the storage ACL" }
          if ($acl -notmatch 'Administrators') { throw "expected Administrators in the storage ACL" }

      # The e2e step below rebuilds target\release\peaktweaks.exe as a test
      # variant; keep the shipped one for the network check at the end.
      - name: Keep a copy of the shipped exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'shipped') | Out-Null
          Copy-Item target\release\peaktweaks.exe (Join-Path $env:RUNNER_TEMP 'shipped\peaktweaks.exe')

      # Checks the assumptions the capture code makes against the real program,
      # then captures real frames from a browser window running an animation and
      # pushes them through our tool, parser and statistics.
      - name: PresentMon reality check
        shell: pwsh
        run: |
          $pm = (Resolve-Path vendor\presentmon\PresentMon-x64.exe).Path
          $pin = Get-Content vendor\presentmon\PINNED.json -Raw | ConvertFrom-Json
          $help = (& $pm --help 2>&1 | Out-String)
          Write-Host ($help.Split("`n") | Select-Object -First 6 | Out-String)
          if ($help -notmatch [regex]::Escape("PresentMon $($pin.version)")) { throw "the version banner does not say PresentMon $($pin.version)" }
          foreach ($f in '--process_name','--output_file','--delay','--timed','--terminate_after_timed','--no_console_stats','--session_name','--stop_existing_session') {
            if ($help -notmatch [regex]::Escape($f)) { throw "PresentMon --help does not list $f" }
          }
          Write-Host "all flags we use are listed by the real program"

          $page = Join-Path $env:RUNNER_TEMP 'anim.html'
          Set-Content $page '<body style="margin:0"><canvas id=c width=800 height=600></canvas><script>const x=c.getContext("2d");let t=0;function f(){t++;x.fillStyle="hsl("+(t%360)+",80%,50%)";x.fillRect(0,0,800,600);requestAnimationFrame(f)}f()</script>'
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { Write-Host "Edge not found; skipping the real-frames check"; return }
          $proc = Start-Process $edge -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\edge-ci","--no-first-run","--no-default-browser-check","--new-window","file:///$($page.Replace('\','/'))" -PassThru
          Start-Sleep -Seconds 6

          # Which processes present frames on this runner? Ask PresentMon itself.
          $diag = Join-Path $env:RUNNER_TEMP 'pm-all.csv'
          Write-Host "--- PresentMon, no process filter, 8 s"
          & $pm --output_file $diag --timed 8 --terminate_after_timed --no_console_stats --session_name PeakTweaksDiag --stop_existing_session 2>&1 | Out-String | Write-Host
          $target = 'msedge.exe'
          if (Test-Path $diag) {
            Write-Host "CSV header:"; Get-Content $diag -TotalCount 1
            $rows = @(Import-Csv $diag)
            Write-Host "rows: $($rows.Count)"
            $top = @($rows | Group-Object Application | Sort-Object Count -Descending | Select-Object -First 5)
            $top | ForEach-Object { Write-Host ("  {0,-32} {1} frames" -f $_.Name, $_.Count) }
            $best = $top | Where-Object { $_.Count -ge 60 -and $_.Name -match '^[A-Za-z0-9._ +()-]+\.exe$' } | Select-Object -First 1
            if ($best) { $target = $best.Name }
          } else {
            Write-Host "no CSV was written: nothing on this runner presented frames while PresentMon watched"
          }
          Write-Host "target for the end-to-end test: $target"
          $env:PEAKTWEAKS_REAL_CAPTURE_EXE = $target
          try { cargo test --workspace real_presentmon_captures_real_frames -- --nocapture --test-threads=1 }
          finally { Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force }

      # Evidence steps run last so the end of the job log holds them.
      # Evidence, not just pass/fail: what the real probes and the real restore
      # operations do on a Windows runner. (Runners are Windows Server, where
      # System Restore does not exist, so the restore calls should fail cleanly.)
      - name: Live probes on this runner
        run: cargo test --workspace -- --nocapture --test-threads=1 live_probe_report spi_getmouse_order

      - name: Real restore operations on this runner
        run: cargo test --workspace the_real_operations_fail_cleanly -- --nocapture --test-threads=1

      # These two pass even when they cannot do their job (no permission to create
      # a local user; no way to make WMI slow), and say NOT VERIFIED when so. The
      # output is what tells which happened.
      - name: Storage ownership and WMI timeout on this runner
        run: cargo test --workspace -- --nocapture --test-threads=1 a_directory_owned_by_a_standard_user a_caller_is_released_at_its_timeout

      # The only code that writes the real registry, on the real registry: the
      # RegistryBackend contract, engine apply/revert, and reg.exe import of the
      # .reg backups (scratch keys under HKCU only).
      # Runs even when cargo test failed: its output is what explains a failure.
      - name: Real registry write path on this runner
        if: ${{ !cancelled() }}
        run: cargo test -p peaktweaks-engine registry::contract_tests -- --nocapture --test-threads=1

      # The field-check tool (docs/FIELD_CHECK.md) is what Kegan runs on a real PC.
      # Here it runs read-only on the runner, so a release never ships a tool
      # that cannot even start.
      - name: Field check (read-only) on this runner
        shell: pwsh
        run: |
          cargo build --release -p peaktweaks-field-check
          $out = Join-Path $env:RUNNER_TEMP 'field-check'
          & target\release\peaktweaks-field-check.exe --out $out --nvml-seconds 2
          if ($LASTEXITCODE -ne 0) { throw "field check exited with $LASTEXITCODE" }
          $r = Get-Content (Join-Path $out 'report.json') -Raw | ConvertFrom-Json
          foreach ($p in $r.PSObject.Properties) {
            if ($null -ne $p.Value.ok) { Write-Host ("{0,-24} ok={1} {2}" -f $p.Name, $p.Value.ok, $p.Value.error) }
          }
          if (-not $r.audit.ok) { throw "the audit section failed in the field check" }
          # Windows' own names next to the codes we hard-code (N43, N22).
          Write-Host "--- powercfg /list (N43: GUIDs in power.rs)"
          Write-Host $r.powercfgList.result.stdout
          Write-Host "--- MSFT_PhysicalDisk raw rows (N22: MediaType codes in hardware.rs)"
          Write-Host ($r.wmiPhysicalDisks.result | ConvertTo-Json -Depth 5 -Compress)
          Write-Host "--- Get-PhysicalDisk, the same disks with Windows' names for MediaType"
          Get-PhysicalDisk | Select-Object DeviceId, FriendlyName, MediaType, BusType | Format-Table -AutoSize | Out-String | Write-Host
          Copy-Item (Join-Path $out 'report.json') field-check-report.json

      # The real app, end to end: release exe, its WebView2 window, the real engine,
      # this machine. tauri-driver speaks WebDriver; msedgedriver must match the
      # WebView2 runtime's version.
      - uses: actions/upload-artifact@v6
        with:
          name: peaktweaks-field-check
          path: |
            target/release/peaktweaks-field-check.exe
            field-check-report.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: peaktweaks-exe
          path: target/release/peaktweaks.exe
          if-no-files-found: error

      # The real app, end to end: its WebView2 window, the real engine, this
      # machine, driven through WebDriver. WebView2 ignores the debugging flags
      # msedgedriver passes in the environment (NOTES.md N46), so this rebuilds a
      # test variant, AFTER the shipped exe was uploaded above, that differs in
      # two ways: --remote-debugging-port in the window's browser arguments, and
      # a capability without allow-revert-all so the IPC boundary check has a
      # registered command to see refused (command_audit.rs keeps it in sync).
      - name: Real app UI end to end (WebDriver)
        shell: pwsh
        run: |
          npx tauri build --no-bundle --config e2e-tauri/tauri.e2e.conf.json
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $v) { $v = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2 version: $v"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $ok = $false
          foreach ($host_ in 'https://msedgedriver.microsoft.com', 'https://msedgedriver.azureedge.net') {
            try { Invoke-WebRequest "$host_/$v/edgedriver_win64.zip" -OutFile $zip -UseBasicParsing; $ok = $true; break } catch { Write-Host "no driver at $host_ ($_)" }
          }
          if (-not $ok) { throw "could not download msedgedriver $v" }
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = (Resolve-Path target\release\peaktweaks.exe).Path
          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          do { Start-Sleep -Seconds 2; try { $null = Invoke-WebRequest http://127.0.0.1:9222/json/version -UseBasicParsing; $up = $true } catch { $up = $false } } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) { throw "the test build opened no WebView2 debugging port" }
          $log = Join-Path $env:RUNNER_TEMP 'msedgedriver.log'
          $drv = Start-Process (Join-Path $dir 'msedgedriver.exe') -ArgumentList '--port=4444', '--verbose', "--log-path=$log" -PassThru
          Start-Sleep -Seconds 3
          try {
            $env:DEBUGGER_ADDRESS = '127.0.0.1:9222'
            node e2e-tauri/real-app.mjs $exe
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -ErrorAction SilentlyContinue | Select-String -Pattern 'ERROR|SEVERE' | Select-Object -First 30 | ForEach-Object { $_.Line } | Write-Host
              Get-Content (Join-Path $env:LOCALAPPDATA 'PeakTweaks\startup-error.log') -ErrorAction SilentlyContinue | Write-Host
              throw "real-app checks failed"
            }
          }
          finally {
            Stop-Process -Id $drv.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      # Agent brief Phase 3 "done when": Apply and Undo through the real UI on
      # the real registry, then registry and journal must agree. A third build,
      # with dev-stubs (open restore gate, Pro licence: a runner has no System
      # Restore and the only change it can make is the Pro mouse tweak). Never
      # uploaded; the shipped exe was uploaded and copied aside above.
      - name: Apply and Undo end to end on the real registry
        shell: pwsh
        run: |
          npx tauri build --no-bundle --features dev-stubs --config e2e-tauri/tauri.e2e.conf.json
          # The previous step's WebView2 may still hold debugging port 9222.
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $exe = (Resolve-Path target\release\peaktweaks.exe).Path
          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          do { Start-Sleep -Seconds 2; try { $null = Invoke-WebRequest http://127.0.0.1:9222/json/version -UseBasicParsing; $up = $true } catch { $up = $false } } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) { throw "the dev-stubs test build opened no WebView2 debugging port" }
          $drv = Start-Process (Join-Path $env:RUNNER_TEMP 'edgedriver\msedgedriver.exe') -ArgumentList '--port=4444' -PassThru
          Start-Sleep -Seconds 3
          try {
            $env:DEBUGGER_ADDRESS = '127.0.0.1:9222'
            node e2e-tauri/apply-undo.mjs
            if ($LASTEXITCODE -ne 0) {
              Get-Content (Join-Path $env:LOCALAPPDATA 'PeakTweaks\startup-error.log') -ErrorAction SilentlyContinue | Write-Host
              throw "apply/undo checks failed"
            }
          }
          finally {
            Stop-Process -Id $drv.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      # Phase 5 gate, runtime half (the dependency half is check-no-network-deps.sh):
      # Windows' own connection audit log, a positive control, then 150 s of the
      # shipped exe and every process it starts. Fails on any network connection
      # by peaktweaks.exe; reports WebView2's own (NOTES.md N40). Last, so its
      # report is at the end of the log.
      - name: The app opens no network connections
        shell: pwsh
        run: ./scripts/check-no-outbound.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'shipped\peaktweaks.exe') -Seconds 150

  # Fast cross-OS check: the engine's journal and transaction logic runs against
  # the in-memory registry, so it is tested on Linux too.
  engine-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (engine only)
        run: cargo test -p peaktweaks-engine
      # Plan 6.4: the default (Starter) build has no networking crate.
      - name: No networking crates in the default build
        run: ./scripts/check-no-network-deps.sh

      - name: Generated TypeScript is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            git status --porcelain -- src/generated
            git diff -- src/generated
            echo "src/generated is stale" >&2
            exit 1
          fi

  # The UI: types, unit and component tests, copy lint, and a browser smoke test
  # with an accessibility scan against the SAMPLE build (plan section 7).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: UI copy makes no efficacy claims
        run: |
          npm run test:scripts
          npm run lint:copy
      - name: Release build contains no SAMPLE data
        run: |
          npx vite build
          if grep -l "Sample setting" dist/assets/*.js; then echo "the SAMPLE mock leaked into the release bundle" >&2; exit 1; fi
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test and accessibility scan
        run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
