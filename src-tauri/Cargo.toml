[package]
name = "peaktweaks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
peaktweaks-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Opens the restore gate and the paid tier so the engine can be driven by hand.
# Never enabled in CI or release builds.
dev-stubs = ["peaktweaks-engine/dev-stubs"]
