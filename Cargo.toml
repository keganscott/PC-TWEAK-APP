[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[profile.release]
strip = true
lto = true
codegen-units = 1
# Unwind, not abort: the command layer and the proof sampler turn a panic on a
# worker thread into an error the user sees. With abort those handlers could
# never run and the window would just vanish mid-command.
panic = "unwind"
